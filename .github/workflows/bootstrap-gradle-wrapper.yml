name: Bootstrap official Gradle wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'SyntaxDevTeam/SyntaxLauncher' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
      - name: Generate and verify official Gradle wrapper
        run: |
          gradle --no-daemon wrapper --gradle-version 9.4.0 --distribution-type bin
          chmod +x gradlew
          test -s gradle/wrapper/gradle-wrapper.jar
          grep -q "gradle-9.4.0-bin.zip" gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version
      - name: Commit Gradle wrapper to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.jar
          if git diff --cached --quiet; then
            echo "Gradle wrapper already tracked and up to date"
          else
            git commit -m "build: add official Gradle 9.4.0 wrapper"
            git push origin HEAD:main
          fi
