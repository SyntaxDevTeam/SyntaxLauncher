name: Build and package SyntaxLauncher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntaxlauncher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core and desktop compilation
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
      - name: Verify canonical product version and release tag
        run: python3 scripts/launcher_version.py --github-ref "$GITHUB_REF"
      - name: Compile and run tests
        run: gradle --no-daemon --stacktrace "-PlauncherBuildNumber=$GITHUB_RUN_NUMBER" "-PlauncherCommit=$GITHUB_SHA" test build
      - name: Test update packaging protocol
        run: python3 -m unittest discover -s scripts -p "test_*.py"

      - name: Test Build Explorer publisher
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: syntaxlauncher-test-results
          path: |
            launcher-core/build/test-results/**
            launcher-core/build/reports/tests/**
            launcher-desktop/build/reports/**
            launcher-desktop/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  distributables:
    name: Portable app (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build runnable native app directory
        shell: bash
        run: |
          version="$(python3 scripts/launcher_version.py --github-ref "$GITHUB_REF")"
          gradle --no-daemon --stacktrace "-PlauncherBuildNumber=$GITHUB_RUN_NUMBER" "-PlauncherCommit=$GITHUB_SHA" :launcher-desktop:createDistributable
          python scripts/package_update.py --source launcher-desktop/build/compose/binaries/main/app --platform "${{ matrix.artifact }}" --version "$version" --output "launcher-desktop/build/updates/syntaxlauncher-update-${{ matrix.artifact }}.zip"
          gradle --no-daemon --stacktrace "-PlauncherBuildNumber=$GITHUB_RUN_NUMBER" "-PlauncherCommit=$GITHUB_SHA" "-PupdateBundle=build/updates/syntaxlauncher-update-${{ matrix.artifact }}.zip" :launcher-desktop:verifyUpdateBundle
      - name: Show jpackage diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -d launcher-desktop/build/compose/logs ]; then
            find launcher-desktop/build/compose/logs -type f -name "*.txt" -print -exec tail -n 100 {} \;
          else
            echo "No Compose packaging logs found"
          fi
      - name: Upload jpackage diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: syntaxlauncher-packaging-logs-${{ matrix.artifact }}-${{ github.sha }}
          path: launcher-desktop/build/compose/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Archive portable application preserving POSIX permissions
        shell: bash
        run: |
          test -d launcher-desktop/build/compose/binaries/main/app
          tar -czf syntaxlauncher-${{ matrix.artifact }}.tar.gz -C launcher-desktop/build/compose/binaries/main/app .
      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: syntaxlauncher-${{ matrix.artifact }}-${{ github.sha }}
          path: syntaxlauncher-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified update bundle
        uses: actions/upload-artifact@v7
        with:
          name: syntaxlauncher-update-${{ matrix.artifact }}
          path: launcher-desktop/build/updates/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish complete tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: distributables
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: syntaxlauncher-update-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: syntaxlauncher-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Publish all platform updates together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/syntaxlauncher-update-linux-x64.zip
          test -f release-assets/syntaxlauncher-update-windows-x64.zip
          test -f release-assets/syntaxlauncher-update-macos-arm64.zip
          test -f release-assets/syntaxlauncher-linux-x64.tar.gz
          test -f release-assets/syntaxlauncher-windows-x64.tar.gz
          test -f release-assets/syntaxlauncher-macos-arm64.tar.gz
          if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing-release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "SyntaxLauncher $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.tar.gz --clobber
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          fi


  publish-build-explorer:
    name: Publish all platforms to Build Explorer
    needs: [verify, distributables]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: syntaxlauncher-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Publish complete portable build set
        env:
          BUILD_EXPLORER_TOKEN: ${{ secrets.BUILD_EXPLORER_TOKEN }}
        run: python3 scripts/publish_build_explorer.py
