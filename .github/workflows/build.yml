name: Build and package SyntaxLauncher

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: syntaxlauncher-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core and desktop compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
      - name: Compile and run tests
        run: gradle --no-daemon --stacktrace :launcher-core:test :launcher-desktop:compileKotlin
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntaxlauncher-test-results
          path: |
            launcher-core/build/test-results/**
            launcher-core/build/reports/tests/**
            launcher-desktop/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

  distributables:
    name: Portable app (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
      - name: Build runnable native app directory
        run: gradle --no-daemon --stacktrace :launcher-desktop:createDistributable
      - name: Show jpackage diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -d launcher-desktop/build/compose/logs ]; then
            find launcher-desktop/build/compose/logs -type f -name "*.txt" -print -exec tail -n 100 {} \;
          else
            echo "No Compose packaging logs found"
          fi
      - name: Upload jpackage diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: syntaxlauncher-packaging-logs-${{ matrix.artifact }}-${{ github.sha }}
          path: launcher-desktop/build/compose/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: syntaxlauncher-${{ matrix.artifact }}-${{ github.sha }}
          path: launcher-desktop/build/compose/binaries/main/app/
          if-no-files-found: error
          retention-days: 14
